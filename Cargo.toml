[workspace]
resolver = "2"
members = [
    "crates/wp-core",
    "crates/wp-ipc",
    "crates/wp-platform",
    "crates/wp-render",
    "crates/wp-host",
    "crates/wp-supervisor",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
authors = ["wallpaper"]

[workspace.dependencies]
wp-core = { path = "crates/wp-core" }
wp-ipc = { path = "crates/wp-ipc" }
wp-platform = { path = "crates/wp-platform" }
wp-render = { path = "crates/wp-render" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
# 只开 PNG / JPEG / BMP 三个解码器：M1 图片壁纸够用，依赖体积也小。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
windows = "0.62"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
